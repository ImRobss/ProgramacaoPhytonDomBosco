[project]
name = "api"
version = "0.1.0"
description = "Backend em Python (FastAPI) da entrega final"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "requests>=2.34.2",
    "sqladmin>=0.32.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
